# Uses the catalog populated by modules/dinov2_retrieval/docker-compose.yml.
name: wine-recognition
services:
  preprocessing:
    build: ./modules/wine_label_preprocessing
    environment:
      PREPROCESS_VISUAL_MAX_SIDE: "1600"
      PREPROCESS_OCR_MAX_SIDE: "1920"
      PREPROCESS_OCR_MILD: "true"
      PREPROCESS_OCR_UNSHARP: "false"
    networks: [catalog]
    restart: unless-stopped

  dinov2:
    build:
      context: ./modules/dinov2_retrieval
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dinov2:dinov2@postgres:5432/dinov2}
      DATA_ROOT: /data
      DINO_MODEL_NAME: facebook/dinov2-with-registers-giant
      DINO_EMBEDDING_DIMENSION: "1536"
      DINO_DEVICE: cuda
      DINO_DTYPE: float16
      HF_HOME: /home/app/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      OMP_NUM_THREADS: "2"
    gpus: all
    volumes:
      - ./modules/dinov2_retrieval/data:/data:ro
      - ./modules/dinov2_retrieval/model-cache:/home/app/.cache/huggingface
    command: ["serve"]
    networks: [catalog]
    restart: unless-stopped

  superpoint:
    build:
      context: ./modules/superpoint
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu126
        TORCH_VERSION: "2.8.0"
        TORCHVISION_VERSION: "0.23.0"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dinov2:dinov2@postgres:5432/dinov2}
      DATA_ROOT: /data
      DEVICE: cuda
      TORCH_HOME: /home/app/.cache/torch
      MAX_NUM_KEYPOINTS: "1024"
      SUPERPOINT_FEATURE_CACHE_MB: "256"
      SUPERPOINT_FEATURE_CACHE_DIR: /home/app/.cache/torch/superpoint-features
      OMP_NUM_THREADS: "2"
    gpus: all
    volumes:
      - ./modules/dinov2_retrieval/data:/data:ro
      - superpoint_cache:/home/app/.cache/torch
    command: ["serve"]
    networks: [catalog]
    restart: unless-stopped

  ocr:
    build:
      context: ./modules/ocr
      args:
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dinov2:dinov2@postgres:5432/dinov2}
      # 4 GiB workstation: giant + SuperPoint on GPU, OCR + E5 on CPU.
      # Production GPU override below also moves these two models to CUDA.
      OCR_DEVICE: cpu
      # UVDoc is document unwarping, not wine-label segmentation; avoid its
      # additional CPU memory/latency on the 4 GiB workstation profile.
      OCR_USE_DOC_UNWARPING: "false"
      OCR_TEXT_DET_LIMIT_TYPE: max
      OCR_TEXT_DET_LIMIT_SIDE_LEN: "960"
      TEXT_EMBEDDING_DEVICE: cpu
      TEXT_EMBEDDING_MODEL_NAME: intfloat/multilingual-e5-base
      HF_HOME: /home/app/.cache/huggingface
      HF_HUB_DISABLE_XET: "1"
      PADDLE_PDX_MODEL_SOURCE: BOS
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      OMP_NUM_THREADS: "2"
    volumes:
      - ./modules/dinov2_retrieval/model-cache:/home/app/.cache/huggingface
      - paddle_cache:/home/app/.paddlex
      - paddle_legacy_cache:/home/app/.paddleocr
    networks: [catalog]
    restart: unless-stopped

  backend:
    build: ./modules/wine_pipeline
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://dinov2:dinov2@postgres:5432/dinov2}
      DINO_URL: http://dinov2:8000
      SUPERPOINT_URL: http://superpoint:8000
      OCR_URL: http://ocr:8000
      PREPROCESS_URL: http://preprocessing:8000
      COLOR_WEIGHT: "0.05"
      BRANCH_TIMEOUT_SECONDS: "180"
      FEEDBACK_REFERENCE_DIR: /feedback-references
    volumes:
      - ./modules/dinov2_retrieval/data/reference/feedback:/feedback-references
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      preprocessing:
        condition: service_started
      dinov2:
        condition: service_healthy
      superpoint:
        condition: service_healthy
      ocr:
        condition: service_started
    networks: [catalog]
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      NUXT_PIPELINE_URL: http://backend:8080
      NUXT_DINO_URL: http://dinov2:8000
    ports: ["0.0.0.0:3000:3000"]
    depends_on: [backend]
    networks: [catalog]
    restart: unless-stopped

networks:
  catalog:
    external: true
    name: dinov2_retrieval_default
volumes:
  superpoint_cache:
  paddle_cache:
  paddle_legacy_cache:
