services:
  dinov2-retrieval:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    working_dir: /app
    env_file:
      - .env
    environment:
      DATA_ROOT: /data
      MAX_IMAGE_SIZE_BYTES: ${MAX_IMAGE_SIZE_BYTES:-10485760}
      HF_HOME: /root/.cache/huggingface
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: true
      - type: bind
        source: ./model-cache
        target: /root/.cache/huggingface
    command: ["--help"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import dinov2_retrieval; from dinov2_retrieval.config import get_data_root; get_data_root()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    restart: "no"
