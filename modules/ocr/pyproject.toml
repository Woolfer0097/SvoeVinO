[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-ocr"
version = "0.1.0"
description = "OCR service for Russian wine label text extraction"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "Pillow>=10.0,<13.0",
    "numpy>=1.26,<3.0",
    "opencv-python-headless>=4.9,<5.0",
    # Keep the evaluated runtime stable until a new OCR model is compared.
    "paddleocr==3.7.0",
    # PaddlePaddle 3.3.x CPU inference breaks PP-OCRv5 with a PIR/oneDNN error.
    "paddlepaddle==3.2.2",
]

[project.optional-dependencies]
matching = [
    "torch>=2.7,<3.0",
    "transformers>=4.45,<5.0",
    "psycopg[binary]>=3.1,<4.0",
    "pgvector>=0.2.5,<1.0",
]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
